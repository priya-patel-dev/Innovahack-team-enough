version: '3.8'

services:
  zipprompt-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zipprompt-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=*
      - PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - zipprompt-net

networks:
  zipprompt-net:
    driver: bridge
